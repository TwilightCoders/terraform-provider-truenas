# Release configuration for the Terraform Registry.
#
# The registry requires a specific set of assets: one zip per platform named
# terraform-provider-{NAME}_{VERSION}_{OS}_{ARCH}.zip, a SHA256SUMS file, a detached GPG
# signature of it, and a manifest declaring the protocol versions the provider speaks.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  # The registry checks the manifest against the checksums like any other asset, so it has to be
  # hashed here as well as published with the release. Attaching it to the release alone fails
  # ingestion with "missing SHA256 checksum".
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  draft: false
  # The registry reads the protocol version from a manifest published beside the archives.
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  disable: true
